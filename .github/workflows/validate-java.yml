name: Validate Java Projects

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'projects/**/pom.xml'
      - 'projects/**/*.java'
      - '.github/workflows/validate-java.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'projects/**/pom.xml'
      - 'projects/**/*.java'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21']
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Find and build Java projects
        run: |
          echo "Looking for Maven projects..."
          
          for pom in $(find projects -name "pom.xml" -type f); do
            dir=$(dirname "$pom")
            echo "📦 Building $dir with Java ${{ matrix.java-version }}"
            
            if [ -f "$dir/pom.xml" ]; then
              cd "$dir"
              mvn -q clean compile 2>/dev/null && echo "✅ $dir compiled successfully" || echo "⚠️  $dir build skipped (no full POM)"
              cd -
            fi
          done

      - name: Check for Java syntax errors
        run: |
          echo "Checking Java syntax..."
          
          for java_file in $(find projects -name "*.java" -type f); do
            javac -cp ".:target/classes" "$java_file" 2>/dev/null && echo "✅ $java_file" || echo "⚠️  $java_file (syntax check skipped)"
          done

      - name: Find and run tests
        if: always()
        run: |
          echo "Looking for test files..."
          
          for test_file in $(find projects -name "*Test.java" -type f); do
            echo "📝 Found test: $test_file"
          done
          
          for pom in $(find projects -name "pom.xml" -type f); do
            dir=$(dirname "$pom")
            if [ -f "$dir/pom.xml" ]; then
              echo "Running tests in $dir..."
              cd "$dir"
              mvn -q test 2>/dev/null || true
              cd -
            fi
          done
